<!doctype html>
<!-- Source for store-assets/android/feature-graphic-1024x500.png. Render at a 1024x500 viewport, deviceScaleFactor 1, and screenshot the page. -->
<html><head><meta charset="utf-8"><title>Savvo feature graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  :root { --sand:#faf9f7; --stone-200:#e7e5e4; --stone-700:#44403c; --stone-900:#1c1917; --copper:#c2410c; --copper-light:#ea580c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  body { background: var(--sand); background-image: radial-gradient(circle at 1px 1px, var(--stone-200) 1px, transparent 0); background-size: 24px 24px; font-family:'DM Sans', sans-serif; color:var(--stone-900); position:relative; }
  .copy { position:absolute; left:72px; top:0; bottom:0; width:520px; display:flex; flex-direction:column; justify-content:center; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .brand img { width:52px; height:52px; }
  .brand span { font-family:'DM Serif Display', serif; font-size:34px; color:var(--copper); letter-spacing:-0.01em; }
  h1 { font-family:'DM Serif Display', serif; font-weight:400; font-size:58px; line-height:1.04; letter-spacing:-0.02em; color:var(--stone-900); }
  h1 em { font-style:normal; background:linear-gradient(90deg,var(--copper),var(--copper-light)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin-top:20px; font-size:21px; line-height:1.45; color:var(--stone-700); max-width:440px; }
  .phone { position:absolute; right:70px; top:48px; width:300px; height:560px; border-radius:40px; background:#1c1917; padding:10px; box-shadow: 0 30px 60px -20px rgba(68,64,60,.45), 0 0 0 1px rgba(28,25,23,.08); transform: rotate(4deg); }
  .screen { width:100%; height:100%; border-radius:31px; overflow:hidden; background:var(--sand); }
  .screen img { width:100%; display:block; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../public/icon.svg" alt=""><span>Savvo</span></div>
    <h1>Keep every<br>connection <em>alive.</em></h1>
    <p>Know who to reach out to today, keep every promise, and keep your raise moving.</p>
  </div>
  <div class="phone"><div class="screen"><img src="../ios/iphone-6.7in-01-next-moves.png" alt=""></div></div>
</body></html>
